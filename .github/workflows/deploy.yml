name: Deploy VigiSwap to Cloudflare Pages

# A deploy is the last step of a gate, not the first step of a pipeline.
#
# Main deploys, so that what is on the site and what is in the branch are the same thing. What
# changed is that nothing reaches Cloudflare until it has passed: a static export does not clear
# `out/` on rebuild and the Pages asset cache keeps answering for files that no longer exist, so
# publishing an unverified build is how two builds end up being served at once.
#
# What the gate does: install from the lockfile, audit, typecheck, test, build. It used to install
# with `--legacy-peer-deps --no-audit`, build and publish, with every action floating on a mutable
# tag (H-09/M-10, audit 2026-08-26). `--legacy-peer-deps` silences the resolver rather than
# resolving what it complains about, and `@v4` is whatever that tag points at on the day it runs —
# for a workflow holding a Cloudflare API token, that is somebody else's decision about what our
# secret executes. Every action is pinned to a commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigiswap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what the lockfile says. If a peer dependency genuinely conflicts,
      # that is a thing to resolve in the lockfile, not to wave through on every build.
      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigiswap-out
          if-no-files-found: error
          retention-days: 5
          path: out

  deploy:
    # Only what the gate passed — never a copy this job built for itself.
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # `wrangler pages deploy out` publishes the static export AND compiles `functions/` from the
      # working directory. A job that downloads only the build artefact has no `functions/`, so it
      # publishes a site whose entire API is a 404 — which is what the first run of this workflow
      # did to the live site. The tree is needed here; the BUILD still comes from the gate.
      - name: Checkout (for functions/ and headers)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Take the verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vigiswap-out
          path: out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=vigiswap --branch=main
